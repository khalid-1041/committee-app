<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Committee App</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f0}
.header{background:#0A7A3A;color:#fff;padding:15px;text-align:center}
.header h1{margin:0;font-size:22px}
.header p{margin:5px 0 0;font-size:13px}
.container{max-width:600px;margin:auto;padding:12px;padding-bottom:40px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,0.08)}
h3{margin:0 0 10px 0}
input{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{padding:11px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.btn-green{background:#0A7A3A;color:#fff;width:100%}
.btn-blue{background:#007bff;color:#fff;width:100%}
.btn-orange{background:#ff9800;color:#fff}
.btn-red{background:#ff4444;color:#fff}
.btn-gray{background:#eee}
.small{font-size:12px;color:#666}
.row{display:flex;gap:8px}
.row button{flex:1}
.member-box{border:1px solid #eee;padding:10px;border-radius:10px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #eee;padding:6px;text-align:center}
th{background:#f8f8f8}
.hidden{display:none}
#editBox{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.3);width:90%;max-width:340px;z-index:999}
</style>
</head>
<body>
<div class="header">
  <h1>💰 Committee App</h1>
  <p id="committeeInfo">📊 Total Member: 0 | Committee: 0 Mahine ki</p>
</div>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h3>👋 Welcome</h3>
  <div class="row">
    <button class="btn-green" onclick="showLogin('admin')">Admin</button>
    <button class="btn-blue" onclick="showLogin('member')">Member</button>
  </div>
  <div id="adminLogin">
    <input id="adminPass" type="password" placeholder="Admin Password - 1234">
    <button class="btn-green" onclick="doAdminLogin()">Login</button>
  </div>
  <div id="memberLogin" class="hidden">
    <input id="memberNameInput" placeholder="Apna Naam likhen">
    <input id="memberPhoneInput" placeholder="Phone Number">
    <button class="btn-blue" onclick="doMemberLogin()">Login</button>
  </div>
</div>

<!-- MAIN -->
<div id="mainBox" class="hidden">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><b id="welcomeText"></b><br><span class="small" id="roleText"></span></div>
    <button class="btn-red" onclick="doLogout()" style="width:auto">Logout</button>
  </div>

  <!-- ADMIN ADD -->
  <div id="adminPanel" class="card hidden">
    <h3>➕ Naya Member Add Karein</h3>
    <input id="newName" placeholder="Naam">
    <input id="newPhone" placeholder="Phone Number - 0300-1234567">
    <input id="newAmount" type="number" placeholder="Monthly Raqam - 10000">
    <button class="btn-green" onclick="doAddMember()">Member Add Karein</button>
    <div class="row" style="margin-top:10px">
      <button class="btn-orange" onclick="doDrawNow()">🎲 Draw Nikalo</button>
      <button class="btn-gray" onclick="clearAll()">🗑️ Clear</button>
    </div>
  </div>

  <!-- MEMBER STATUS -->
  <div id="memberPanel" class="card hidden">
    <h3>👤 Mera Status</h3>
    <p id="memberStatus" style="font-size:14px;line-height:1.6"></p>
    <button id="withdrawBtn" class="btn-green hidden" onclick="doWithdraw()">💰 Withdraw</button>
  </div>

  <!-- MEMBERS -->
  <div class="card">
    <h3>👥 Members (<span id="memberCount">0</span>)</h3>
    <div id="membersList"></div>
  </div>

  <!-- CALENDAR -->
  <div class="card">
    <h3>📅 Payment Calendar</h3>
    <div id="calendarList"></div>
  </div>

  <!-- DRAW -->
  <div class="card">
    <h3>🎲 Draw Results</h3>
    <div id="drawList">Abhi koi Draw nahi hua</div>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <h3>📜 History</h3>
    <div id="historyList" style="font-size:13px;line-height:1.7"></div>
  </div>
</div>

</div>

<!-- EDIT POPUP -->
<div id="editBox">
  <h3 style="margin-top:0">✏️ Member Edit Karein</h3>
  <label>Naam</label><input id="editName">
  <label>Phone Number</label><input id="editPhone">
  <label>Monthly Raqam</label><input id="editAmount" type="number">
  <div class="row"><button class="btn-green" onclick="doSaveEdit()">✅ Save</button><button class="btn-gray" onclick="closeEdit()">Cancel</button></div>
</div>

<script type="module" src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
